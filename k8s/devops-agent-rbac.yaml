apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-agent
  namespace: devops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-agent
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-agent
  namespace: default
subjects:
  - kind: ServiceAccount
    name: devops-agent
    namespace: devops-agent
roleRef:
  kind: Role
  name: devops-agent
  apiGroup: rbac.authorization.k8s.io