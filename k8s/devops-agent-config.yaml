apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-agent-config
  namespace: devops-agent
data:
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  K8S_NAMESPACE: "default"
  MONITOR_SERVICE_NAME: "infrastructure"
  AUDIT_BACKEND: "sqlite"
  AUDIT_DB_PATH: "/app/data/audit.sqlite3"
  PYTHONUNBUFFERED: "1"
