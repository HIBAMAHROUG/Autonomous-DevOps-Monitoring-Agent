global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    prometheus: monitoring/monitoring-kube-prometheus
    prometheus_replica: ${POD_NAME}

rule_files:
  - /etc/prometheus/rules/*.yaml
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: serviceMonitor/monitoring/monitoring-grafana
    honor_labels: true
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
    metrics_path: /metrics
    scheme: http
    relabel_configs:
      - source_labels: [job]
        target_label: __tmp_prometheus_job_name
      - action: keep
        source_labels:
          - __meta_kubernetes_service_label_app_kubernetes
          - __meta_kubernetes_service_labelpresent_app_kubernetes
        regex: (monitoring);true