apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: agent-demo
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "demo-app started"
              while true; do
                echo "demo-app healthy"
                sleep 10
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: agent-demo
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 8080