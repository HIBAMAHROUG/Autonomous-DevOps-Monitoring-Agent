version: "3.8"

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: monitoring
      DOCKER_INFLUXDB_INIT_BUCKET: ai-agent
      DOCKER_INFLUXDB_INIT_RETENTION: 720h0m0s
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: monitoring-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: always

  api:
    build: .
    container_name: monitoring-api
    command: python -u app.py
    ports:
      - "5000:5000"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: monitoring
      INFLUX_BUCKET: ai-agent
      INFLUX_TOKEN: monitoring-token
      METRICS_RETENTION_DAYS: "30"
      AUDIT_BACKEND: sqlite
      AUDIT_DB_PATH: /app/data/audit.sqlite3
      PYTHONUNBUFFERED: 1
      PROMETHEUS_URL: http://prometheus:9090
      API_KEY: "ma-cle-secrete-locale"
    volumes:
      - ./data:/app/data
    depends_on:
      - influxdb
    restart: always

volumes:
  influxdb-data:
  prometheus-data:
  grafana-data: