# CI/CD : GitHub Actions (et non GitLab CI comme mentionné au cahier des
# charges initial). Écart documenté volontairement : le dépôt est hébergé
# sur GitHub (pas sur un GitLab auto-hébergé ou gitlab.com), et GitHub
# Actions permet d'exécuter les tests et de builder l'image Docker sans
# dépendance à un second outil ni à des runners externes à configurer.
# Le pipeline logique (installation des dépendances, tests, build Docker)
# reste équivalent à ce qui était prévu avec GitLab CI. Détails dans le
# README, section "CI/CD".
name: Autonomous DevOps Agent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t autonomous-devops-agent:test .