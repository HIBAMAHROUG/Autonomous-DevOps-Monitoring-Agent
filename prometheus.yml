global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'monitoring'

# ✅ Règles d'alerte
rule_files:
  - "/etc/prometheus/alerts.yml"

# ✅ Configuration des cibles à scraper
scrape_configs:
  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'

  # ✅ Node Exporter - métriques d'infrastructure
  - job_name: 'node-exporter'
    static_configs:
      - targets: 
          - 'node-exporter:9100'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ✅ Monitoring API
  - job_name: 'api'
    static_configs:
      - targets: 
          - 'api:5000'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ✅ Collector
  - job_name: 'collector'
    static_configs:
      - targets: 
          - 'collector:5001'
    metrics_path: '/metrics'
    scrape_interval: 30s

